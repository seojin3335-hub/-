<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 여행 영상 검색기</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#f6f7fb;color:#17181c}
.wrap{max-width:1000px;margin:40px auto;padding:0 18px}.card{background:#fff;border:1px solid #e7e8ee;border-radius:18px;padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.05)}
h1{margin:0 0 8px;font-size:28px}.muted{color:#6d7280}.search{display:grid;grid-template-columns:1fr 140px 130px;gap:10px;margin-top:20px}
input,select,button{height:46px;border-radius:10px;border:1px solid #d9dce5;padding:0 13px;font-size:15px}
button{cursor:pointer;background:#17181c;color:#fff;border:0;font-weight:700}
#status{margin:20px 0}.item{display:grid;grid-template-columns:180px 1fr auto;gap:18px;padding:18px 0;border-top:1px solid #eceef3}
.thumb{width:180px;height:102px;object-fit:cover;border-radius:10px;background:#eee}
.title{font-weight:700;font-size:17px;margin-bottom:8px}.meta{color:#6d7280;font-size:13px;line-height:1.7}.score{font-weight:800;font-size:20px;text-align:right}.score small{display:block;color:#6d7280;font-size:12px;font-weight:400}
a{color:inherit;text-decoration:none}.actions{margin-top:10px;display:flex;gap:8px}.actions a,.actions button{height:36px;padding:0 11px;font-size:13px;display:inline-flex;align-items:center;border-radius:8px}.actions a{border:1px solid #ddd;background:#fff}
@media(max-width:720px){.search{grid-template-columns:1fr}.item{grid-template-columns:110px 1fr}.thumb{width:110px;height:62px}.score{grid-column:2;text-align:left}.item .actions{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>✈️ AI 여행 영상 검색기</h1>
    <div class="muted">주제를 입력하면 YouTube에서 관련 영상을 찾아 기본 지표로 정렬합니다.</div>
    <div class="search">
      <input id="topic" placeholder="예: 오사카 맛집 여행 브이로그">
      <select id="language"><option value="ko">한국어</option><option value="en">영어</option><option value="ja">일본어</option><option value="zh">중국어</option></select>
      <button id="searchBtn">영상 찾기</button>
    </div>
    <div id="status" class="muted"></div>
    <div id="results"></div>
  </div>
</div>
<script>
const topic = document.getElementById('topic');
const btn = document.getElementById('searchBtn');
const status = document.getElementById('status');
const results = document.getElementById('results');

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function search(){
  const q = topic.value.trim();
  if(!q){status.textContent='검색 주제를 입력하세요.';return}
  btn.disabled=true; status.textContent='YouTube 검색 중...'; results.innerHTML='';
  fetch('/api/search?topic='+encodeURIComponent(q)+'&language='+encodeURIComponent(document.getElementById('language').value))
    .then(r=>r.json().then(x=>({ok:r.ok,x})))
    .then(({ok,x})=>{
      if(!ok || !x.ok) throw new Error(x.error||'검색 실패');
      status.textContent=`${x.items.length}개 결과`;
      results.innerHTML=x.items.map(v=>`
        <div class="item">
          <img class="thumb" src="${esc(v.thumbnail)}" alt="">
          <div>
            <div class="title">${esc(v.title)}</div>
            <div class="meta">채널: ${esc(v.channel)}<br>조회수: ${v.views_text} · 길이: ${esc(v.duration)} · 게시일: ${esc(v.published_at)}</div>
            <div class="actions"><a href="${esc(v.url)}" target="_blank" rel="noopener">YouTube 보기</a><button onclick="alert('2번 자동편집기 연결 기능은 다음 단계에서 추가합니다.')">이 영상 사용</button></div>
          </div>
          <div class="score">${v.score}<small>현재 관련도 점수</small></div>
        </div>`).join('');
    })
    .catch(e=>{status.textContent=e.message})
    .finally(()=>btn.disabled=false);
}
btn.addEventListener('click',search);
topic.addEventListener('keydown',e=>{if(e.key==='Enter')search()});
</script>
</body>
</html>
